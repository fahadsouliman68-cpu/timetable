# Run ONCE by hand. Creates the signing key and prints it (base64) in the run summary,
# so it can be copied into the KEYSTORE_BASE64 secret. The key is protected by KEYSTORE_PASSWORD.
name: create-keystore

on:
  workflow_dispatch:

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "Add the secret KEYSTORE_PASSWORD first (at least 6 characters)."
            exit 1
          fi
          keytool -genkeypair -storetype PKCS12 \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias timetable -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
            -dname "CN=School Timetable, O=School, C=SY"
          {
            echo '### KEYSTORE_BASE64 (copy everything inside the box into the secret)'
            echo '```'
            base64 -w0 "$RUNNER_TEMP/release.keystore"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
