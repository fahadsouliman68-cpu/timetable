# Builds the Android app and runs its JVM unit tests. Written without being executed: first real run is on GitHub.
name: android-build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # gradle-wrapper.jar is binary and is not stored in the repo; generate it here.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Domain tests (pure Kotlin)
        run: ./scripts/test-domain.sh

      - name: Unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
